    <main>

        </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="assets/send.js"></script>
    <script src="assets/anim.js"></script>
    <script src="assets/script.js" defer></script>
    <script src="assets/dynamic-content.js"></script>
    <script>
        async function loadSection(sectionName) {
            try {
                // fetch relatif sans slash initial pour éviter double /content/content/
                const res = await fetch(`content/${sectionName}.json`);
                if (!res.ok) throw new Error(`Erreur chargement ${sectionName}.json`);
                const data = await res.json();

                switch (sectionName) {
                    case 'accueil':  // accueil au lieu d'about
                        document.getElementById('about-title').textContent = data.title || '';
                        document.getElementById('about-body').innerHTML = data.body || '';
                        break;

                    case 'kit':
                        document.getElementById('kit-title').textContent = data.title || '';
                        document.getElementById('kit-intro').textContent = data.intro || '';

                        const kitList = document.getElementById('kit-list');
                        kitList.innerHTML = '';
                        if (Array.isArray(data.items)) {
                            data.items.forEach(item => {
                                const li = document.createElement('li');
                                li.textContent = item;
                                kitList.appendChild(li);
                            });
                        }
                        document.getElementById('kit-note').textContent = data.note || '';
                        break;

                    case 'valeurs':
                        document.getElementById('valeurs-title').textContent = data.title || '';
                        document.getElementById('valeurs-intro').textContent = data.intro || '';

                        const valeursList = document.getElementById('valeurs-list');
                        valeursList.innerHTML = '';
                        if (Array.isArray(data.values)) {  // clef "values" en anglais dans JSON
                            data.values.forEach(v => {
                                const div = document.createElement('div');
                                div.className = 'valeur-item';
                                div.innerHTML = `<h3>${v.title}</h3><p>${v.description}</p>`;
                                valeursList.appendChild(div);
                            });
                        }
                        break;

                    case 'equipe':
                        document.getElementById('equipe-title').textContent = data.title || '';
                        document.getElementById('equipe-intro').textContent = data.intro || '';

                        const equipeList = document.getElementById('equipe-list');
                        equipeList.innerHTML = '';
                        if (Array.isArray(data.members)) {  // clef "members" en anglais dans JSON
                            data.members.forEach(m => {
                                const div = document.createElement('div');
                                div.className = 'membre-item';
                                div.innerHTML = `<h3>${m.name}</h3><p>${m.role}</p>`;
                                equipeList.appendChild(div);
                            });
                        }
                        break;

                    case 'contact':
                        document.getElementById('contact-title').textContent = data.title || '';
                        document.getElementById('contact-description').textContent = data.description || '';

                        const qrcodesDiv = document.getElementById('contact-qrcodes');
                        qrcodesDiv.innerHTML = '';
                        if (Array.isArray(data.qrcodes)) {
                            data.qrcodes.forEach(qr => {
                                const img = document.createElement('img');
                                img.src = qr.src;
                                img.alt = qr.alt || 'QR Code';
                                img.className = 'qrcode-img';
                                qrcodesDiv.appendChild(img);
                            });
                        }

                        document.getElementById('contact-problem').textContent = data.problem || '';
                        document.getElementById('contact-mail').textContent = data.mail || '';
                        break;

                    default:
                        console.warn(`Section inconnue : ${sectionName}`);
                }

            } catch (e) {
                console.error(e);
            }
        }

        // Charge toutes les sections au chargement
        ['accueil', 'kit', 'valeurs', 'equipe', 'contact'].forEach(loadSection);
    </script>


</body>

</html>
