backend:
  name: git-gateway
  branch: master

media_folder: "static/uploads"
public_folder: "/static/uploads"

collections:
  - name: "accueil"
    label: "Accueil"
    files:
      - label: "Page d'accueil"
        name: "index"
        file: "index.html"
        fields:
          - {label: "Titre principal", name: "title", widget: "string"}
          - {label: "Contenu", name: "body", widget: "markdown"}
