backend:
  name: git-gateway
  branch: master


media_folder: "static/uploads"
public_folder: "/static/uploads"

collections:
  - name: "accueil"
    label: "Accueil"
    files:
      - label: "Page d'accueil"
        name: "index"
        file: "content/accueil.json"
        fields:
          - { label: "Titre principal", name: "title", widget: "string" }
          - { label: "Contenu", name: "body", widget: "markdown" }
